<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 UTF-8 문자 인코딩을 사용합니다. -->
  <meta charset="UTF-8" />

  <!-- 휴대폰 화면 크기에 맞춰 화면을 표시합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 브라우저 탭에 표시될 제목입니다. -->
  <title>오늘장 - 전국 5일장 찾기</title>

  <!-- 별도의 CSS 파일을 불러옵니다. -->
  <link rel="stylesheet" href="/css/main.css" />

  <link
          rel="icon"
          type="image/png"
          href="/images/favicon.png">
</head>
<body>
<!-- 화면 전체 내용을 감싸는 영역입니다. -->
<main class="container">

  <a href="/" class="logo">

    <!-- 서비스 로고입니다. -->
    <img
            src="/images/logo.png"
            alt="오늘장 로고"
            class="logo-image">

    <!-- 서비스 이름입니다. -->
    <span>오늘장</span>

  </a>

  <!-- 서비스 소개 영역입니다. -->
  <section class="hero">
    <h1>
      여행지 주변 장날을<br />
      쉽게 찾아보세요.
    </h1>

    <p>
      오늘 열리는 장부터 여행 날짜에 맞는 5일장까지 확인할 수 있어요.
    </p>
  </section>

  <!-- 검색 조건을 입력하는 영역입니다. -->
  <section class="search-box">

    <label>시장 유형</label>

    <div class="market-type-buttons">
      <button type="button" class="active" data-market-type="five-day">
        5일장
      </button>

      <button type="button" data-market-type="market">
        시장
      </button>
    </div>

    <!-- 날짜 선택 영역의 설명입니다. -->
    <label class="date-label">방문 날짜</label>

    <!-- 날짜 조건 버튼 목록입니다. -->
    <div class="date-buttons">
      <button type="button" class="active" data-date-type="today">
        오늘
      </button>

      <button type="button" data-date-type="custom">
        날짜 선택
      </button>
    </div>

    <input
            type="date"
            id="customDate"
            class="custom-date-input"
            hidden
    />

    <label class="region-label" for="province">여행 지역</label>

    <div class="region-search-row">
      <!-- 도/광역시 선택 -->
      <select id="province">
        <option value="">도/광역시 선택</option>
      </select>

      <!-- 지역과 날짜 조건으로 시장을 검색합니다. -->
      <button
              type="button"
              id="searchButton"
              class="primary-button"
      >
        장날 찾기
      </button>
    </div>

    <!-- 현재 위치를 이용해 주변 시장을 검색합니다. -->
    <button
            type="button"
            id="locationButton"
            class="location-button"
    >
      📍 내 주변 오늘 열리는 장
    </button>
  </section>

  <!-- 검색 결과 영역의 제목입니다. -->
  <h2 class="section-title">검색 결과</h2>

  <!-- 시장 카드 목록이 표시될 영역입니다. -->
  <section class="market-list" id="marketList">
  </section>
</main>

<footer class="footer">
  <p>
    데이터 출처:
    <a
            href="https://www.data.go.kr/data/15012894/standard.do"
            target="_blank"
            rel="noopener noreferrer"
    >
      전국전통시장표준데이터
    </a>
    · 소상공인시장진흥공단
    · 2025-11-26 기준
  </p>

  <p>
    오늘장은 해당 공공기관의 공식·제휴 서비스가 아닙니다.
  </p>

  <p class="footer-divider">
    © 2026 TodayJang. All rights reserved.
    · 문의:
    <button type="button" class="email-copy-button" id="emailCopyButton">
      wjdtnwls0106@gmail.com
    </button>
    <span id="emailCopyStatus" class="email-copy-status"></span>
  </p>
</footer>

<!-- HTML을 모두 읽은 뒤 JavaScript 파일을 불러옵니다. -->
<script
        type="module"
        src="/js/main.js">
</script>
<script src="/js/common.js"></script>
</body>
</html>
