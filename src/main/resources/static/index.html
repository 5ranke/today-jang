<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 UTF-8 문자 인코딩을 사용합니다. -->
  <meta charset="UTF-8" />

  <!-- 휴대폰 화면 크기에 맞춰 화면을 표시합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 브라우저 탭에 표시될 제목입니다. -->
  <title>오늘장 - 전국 5일장 찾기</title>

  <!-- 별도의 CSS 파일을 불러옵니다. -->
  <link rel="stylesheet" href="/css/main.css" />

  <link
          rel="icon"
          type="image/png"
          href="/images/favicon.png">
</head>
<body>
<!-- 화면 전체 내용을 감싸는 영역입니다. -->
<main class="container">

  <a href="/" class="logo">

    <!-- 서비스 로고입니다. -->
    <img
            src="/images/logo.png"
            alt="오늘장 로고"
            class="logo-image">

    <!-- 서비스 이름입니다. -->
    <span>오늘장</span>

  </a>

  <!-- 서비스 소개 영역입니다. -->
  <section class="hero">
    <h1>
      여행지 주변 장날을<br />
      쉽게 찾아보세요.
    </h1>

    <p>
      오늘 열리는 장부터 여행 날짜에 맞는 5일장까지 확인할 수 있어요.
    </p>
  </section>

  <!-- 검색 조건을 입력하는 영역입니다. -->
  <section class="search-box">

    <label for="province">여행 지역</label>

    <div class="region-selects">

      <!-- 도/광역시 선택 -->
      <select id="province">
        <option value="">도/광역시 선택</option>
      </select>

      <!-- 시/군/구 선택 -->
      <select id="cityCounty" disabled>
        <option value="">시·군·구 선택</option>
      </select>

    </div>

    <!-- 날짜 선택 영역의 설명입니다. -->
    <label class="date-label">방문 날짜</label>

    <!-- 날짜 조건 버튼 목록입니다. -->
    <div class="date-buttons">
      <button type="button" class="active" data-date-type="today">
        오늘
      </button>

      <button type="button" data-date-type="tomorrow">
        내일
      </button>

      <button type="button" data-date-type="week">
        이번 주
      </button>

      <button type="button" data-date-type="custom">
        날짜 선택
      </button>
    </div>

    <input
            type="date"
            id="customDate"
            class="custom-date-input"
            hidden
    />

    <!-- 지역과 날짜 조건으로 시장을 검색합니다. -->
    <button
            type="button"
            id="searchButton"
            class="primary-button"
    >
      장날 찾기
    </button>

    <!-- 현재 위치를 이용해 주변 시장을 검색합니다. -->
    <button
            type="button"
            id="locationButton"
            class="location-button"
    >
      📍 내 주변 오늘 열리는 장
    </button>
  </section>

  <!-- 검색 결과 영역의 제목입니다. -->
  <h2 class="section-title">오늘 열리는 장</h2>

  <!-- 시장 카드 목록이 표시될 영역입니다. -->
  <section class="market-list" id="marketList">

    <!-- 첫 번째 예시 시장 카드입니다. -->
    <article class="market-card">
        <span class="badge badge-five-day">
          오늘 큰 장이 열려요
        </span>

      <h3>삼척중앙시장</h3>

      <p class="market-date">
        8월 4일 화요일
      </p>

      <p>
        상설시장 · 매일 방문 가능
      </p>

      <p>
        다음 큰 장날 8월 7일 금요일
      </p>

      <p>
        강원특별자치도 삼척시 진주로 12-21
      </p>

      <div class="tags">
        <span class="tag">농산물</span>
        <span class="tag">수산물</span>
        <span class="tag">음식점</span>
        <span class="tag">주차 가능</span>
      </div>

      <div class="card-actions">
        <button type="button">상세보기</button>
        <button type="button">길찾기</button>
      </div>
    </article>

    <!-- 두 번째 예시 시장 카드입니다. -->
    <article class="market-card">
        <span class="badge badge-always">
          매일 열려요
        </span>

      <h3>중앙시장</h3>

      <p class="market-date">
        오늘 방문 가능
      </p>

      <p>
        강원특별자치도 강릉시 금성로21
      </p>

      <div class="tags">
        <span class="tag">농산물</span>
        <span class="tag">축산물</span>
        <span class="tag">수산물</span>
        <span class="tag">주차 가능</span>
      </div>

      <div class="card-actions">
        <button type="button">상세보기</button>
        <button type="button">길찾기</button>
      </div>
    </article>
  </section>
</main>

<!-- HTML을 모두 읽은 뒤 JavaScript 파일을 불러옵니다. -->
<script src="/js/main.js"></script>
</body>
</html>
